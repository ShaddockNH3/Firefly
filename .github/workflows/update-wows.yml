name: Update WOWS data

on:
  schedule:
    # 每周一 02:00（UTC+8）抓一次
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-wows
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch profile and ship stats
        run: node scripts/fetch-wows.mjs

      - name: Refresh baselines
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/fetch-wows-baselines.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/wows
          if git diff --cached --quiet; then
            echo "数据没有变化"
          else
            git commit -m "chore(wows): 更新战绩数据"
            git push
          fi
